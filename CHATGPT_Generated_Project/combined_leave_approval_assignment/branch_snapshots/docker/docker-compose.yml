services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: leave_approval_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d leave_approval_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/leave_approval_db
      SECRET_KEY: change-me
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
